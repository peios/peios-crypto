# --- RSA key sizes -----------------------------------------------------
# By SP 800-57 Part 1 Rev. 5, Table 2. FIPS 186-5 approves generating keys
# of 2048 bits or more.

[[algorithm]]
id = "rsa-below-1024"
kind = "rsa"
bits = [0, 1023]
operations.keygen = { floor = true }

[[algorithm]]
id = "rsa-1024"
kind = "rsa"
bits = [1024, 2047]
# 80-bit security.
operations.keygen = { grade = "D", fips = false }

[[algorithm]]
id = "rsa-2048"
kind = "rsa"
bits = [2048, 3071]
operations.keygen = { grade = "C", fips = true }

[[algorithm]]
id = "rsa-3072"
kind = "rsa"
bits = [3072, 7679]
operations.keygen = { grade = "B", fips = true }

[[algorithm]]
id = "rsa-7680"
kind = "rsa"
bits = [7680, 2147483647]
operations.keygen = { grade = "A", fips = true }
