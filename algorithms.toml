# Peios's grades for each (algorithm, operation) libpcrypto's hooks govern.
# PROVISIONAL: the Peios Cryptographic Grading specification (PEI-1737)
# will set the methodology and review these.
#
# Grades, from the rule agreed on PEI-1721:
#   U  practically broken, or forbidden by current standards (an RFC's
#      "MUST NOT", NIST's "disallowed");
#   D  no practical break, but below 112-bit security or formally
#      deprecated;
#   C  112-bit security;
#   B  128-bit security;
#   A  192-bit or more.
# `fips` says whether FIPS 140-3 approves the use, apart from the grade.
# `floor` refuses the use under every policy, and exceptions can't lift it.
#
# Each digest and cipher is named by the getter AWS-LC's API offers it
# through. The build fails unless every getter the public headers declare
# is graded here, and the runtime refuses any it can't find, so nothing
# goes ungraded.
#
# Sources: NIST SP 800-57 Part 1 Rev. 5 (security strengths), SP 800-131A
# Rev. 2 (transitions), SP 800-107 Rev. 1 (hash and HMAC strength), RFC
# 6150 (MD4), RFC 6151 (MD5), RFC 7465 (RC4), RFC 8996 (TLS 1.0 and 1.1),
# FIPS 180-4, FIPS 202, FIPS 186-5.

# --- Digests ----------------------------------------------------------
# `digest` grades collision resistance, half the output for an unbroken
# hash; `hmac` grades the MAC, whose strength doesn't rest on collision
# resistance. A digest with no `hmac` grade is one AWS-LC won't key HMAC
# with; the runtime refuses it as ungraded before AWS-LC would.

[[algorithm]]
id = "md4"
kind = "digest"
getter = "EVP_md4"
# RFC 6150: collisions in microseconds; HMAC-MD4 keys are recoverable.
operations.digest = { grade = "U", fips = false }
operations.hmac = { grade = "U", fips = false }

[[algorithm]]
id = "md5"
kind = "digest"
getter = "EVP_md5"
# RFC 6151: practical collisions, chosen-prefix included. HMAC-MD5 has no
# practical attack but isn't for new protocols.
operations.digest = { grade = "U", fips = false }
operations.hmac = { grade = "D", fips = false }

[[algorithm]]
id = "sha1"
kind = "digest"
getter = "EVP_sha1"
# Practical collisions (SHAttered, 2017) and chosen-prefix collisions
# (2020). FIPS 180-4 still approves SHA-1 for uses other than signatures.
# HMAC-SHA-1 is acceptable under SP 800-131A Rev. 2.
operations.digest = { grade = "U", fips = true }
operations.hmac = { grade = "C", fips = true }

[[algorithm]]
id = "sha224"
kind = "digest"
getter = "EVP_sha224"
operations.digest = { grade = "C", fips = true }
operations.hmac = { grade = "B", fips = true }

[[algorithm]]
id = "sha256"
kind = "digest"
getter = "EVP_sha256"
operations.digest = { grade = "B", fips = true }
operations.hmac = { grade = "B", fips = true }

[[algorithm]]
id = "sha384"
kind = "digest"
getter = "EVP_sha384"
operations.digest = { grade = "A", fips = true }
operations.hmac = { grade = "A", fips = true }

[[algorithm]]
id = "sha512"
kind = "digest"
getter = "EVP_sha512"
operations.digest = { grade = "A", fips = true }
operations.hmac = { grade = "A", fips = true }

[[algorithm]]
id = "sha512-224"
kind = "digest"
getter = "EVP_sha512_224"
operations.digest = { grade = "C", fips = true }
operations.hmac = { grade = "B", fips = true }

[[algorithm]]
id = "sha512-256"
kind = "digest"
getter = "EVP_sha512_256"
operations.digest = { grade = "B", fips = true }
operations.hmac = { grade = "B", fips = true }

[[algorithm]]
id = "sha3-224"
kind = "digest"
getter = "EVP_sha3_224"
operations.digest = { grade = "C", fips = true }
operations.hmac = { grade = "B", fips = true }

[[algorithm]]
id = "sha3-256"
kind = "digest"
getter = "EVP_sha3_256"
operations.digest = { grade = "B", fips = true }
operations.hmac = { grade = "B", fips = true }

[[algorithm]]
id = "sha3-384"
kind = "digest"
getter = "EVP_sha3_384"
operations.digest = { grade = "A", fips = true }
operations.hmac = { grade = "A", fips = true }

[[algorithm]]
id = "sha3-512"
kind = "digest"
getter = "EVP_sha3_512"
operations.digest = { grade = "A", fips = true }
operations.hmac = { grade = "A", fips = true }

[[algorithm]]
id = "shake128"
kind = "digest"
getter = "EVP_shake128"
# FIPS 202: 128-bit security. HMAC isn't defined over an XOF, and AWS-LC
# refuses it.
operations.digest = { grade = "B", fips = true }

[[algorithm]]
id = "shake256"
kind = "digest"
getter = "EVP_shake256"
operations.digest = { grade = "A", fips = true }

[[algorithm]]
id = "blake2b256"
kind = "digest"
getter = "EVP_blake2b256"
# RFC 7693; not NIST-approved.
operations.digest = { grade = "B", fips = false }
operations.hmac = { grade = "B", fips = false }

[[algorithm]]
id = "keccak256"
kind = "digest"
getter = "EVP_keccak256"
# Keccak with the original padding, as Ethereum uses it, not SHA3-256.
# AWS-LC won't key HMAC with it.
operations.digest = { grade = "B", fips = false }

[[algorithm]]
id = "ripemd160"
kind = "digest"
getter = "EVP_ripemd160"
# 80-bit collision resistance; no practical break.
operations.digest = { grade = "D", fips = false }
operations.hmac = { grade = "C", fips = false }

[[algorithm]]
id = "md5-sha1"
kind = "digest"
getter = "EVP_md5_sha1"
# MD5 and SHA-1 side by side, for TLS 1.0 and 1.1 handshakes, which RFC
# 8996 deprecates. AWS-LC won't key HMAC with it.
operations.digest = { grade = "D", fips = false }

[[algorithm]]
id = "md-null"
kind = "digest"
getter = "EVP_md_null"
# Hashes nothing. AWS-LC won't key HMAC with it.
operations.digest = { grade = "U", fips = false }

# --- Ciphers -----------------------------------------------------------
# Graded by key strength, and by the block size where 64-bit blocks make
# birthday attacks practical (Sweet32, 2016).

[[algorithm]]
id = "enc-null"
kind = "cipher"
getter = "EVP_enc_null"
# Encrypts nothing: on the floor, as NULL ciphers are.
operations.encrypt = { floor = true }
operations.decrypt = { floor = true }

[[algorithm]]
id = "rc4"
kind = "cipher"
getter = "EVP_rc4"
# RFC 7465 prohibits RC4 in TLS for its biases.
operations.encrypt = { grade = "U", fips = false }
operations.decrypt = { grade = "U", fips = false }

[[algorithm]]
id = "rc2-40-cbc"
kind = "cipher"
getter = "EVP_rc2_40_cbc"
# A 40-bit export-grade cipher: on the floor.
operations.encrypt = { floor = true }
operations.decrypt = { floor = true }

[[algorithm]]
id = "rc2-cbc"
kind = "cipher"
getter = "EVP_rc2_cbc"
# 64-bit blocks and a weak key schedule; no standard recommends it.
operations.encrypt = { grade = "U", fips = false }
operations.decrypt = { grade = "U", fips = false }

[[algorithm]]
id = "des-ecb"
kind = "cipher"
getter = "EVP_des_ecb"
# A 56-bit key, searched exhaustively since 1998.
operations.encrypt = { grade = "U", fips = false }
operations.decrypt = { grade = "U", fips = false }

[[algorithm]]
id = "des-cbc"
kind = "cipher"
getter = "EVP_des_cbc"
operations.encrypt = { grade = "U", fips = false }
operations.decrypt = { grade = "U", fips = false }

[[algorithm]]
id = "des-ede"
kind = "cipher"
getter = "EVP_des_ede"
# Two-key Triple DES: SP 800-131A Rev. 2 disallows encryption; decryption
# of existing data is legacy use.
operations.encrypt = { grade = "U", fips = false }
operations.decrypt = { grade = "D", fips = false }

[[algorithm]]
id = "des-ede-cbc"
kind = "cipher"
getter = "EVP_des_ede_cbc"
operations.encrypt = { grade = "U", fips = false }
operations.decrypt = { grade = "D", fips = false }

[[algorithm]]
id = "des-ede3"
kind = "cipher"
getter = "EVP_des_ede3"
# Three-key Triple DES: SP 800-131A Rev. 2 disallows encryption after
