# How each function libpcrypto and libpssl export reaches AWS-LC.
#
# Every function AWS-LC's public API offers is listed here exactly once, and
# the build fails on any the list misses or names wrongly:
#
# - A `forward` group's functions are forwarded unchanged. Each group's
#   reason says why policy has nothing to decide there: the function
#   chooses and uses no governed algorithm, or continues an operation whose
#   algorithm was checked when it began.
# - A `pending` group's functions choose or use a governed algorithm, but
#   have no hook yet. They're forwarded unchanged, so policy doesn't govern
#   them until they're hooked.
# - A `[[hook]]` asks the policy runtime before calling AWS-LC. `policy` is
#   the C expression that asks, `failure` what the function returns when
#   it's refused. Its signature must match AWS-LC's declaration, which the
#   compiler checks.
#
# The rule for what policy governs: it applies where an algorithm is chosen
# or a key is used. Starting a digest, keying a cipher, generating a key,
# signing and verifying are governed; updating and finishing an operation
# already begun, and the getters that return an algorithm's description,
# such as `EVP_sha256`, are not. AWS-LC's own internal calls never pass the
# hooks, so every public way of choosing an algorithm needs its own hook:
# hooking `EVP_DigestInit_ex` doesn't govern `EVP_Digest` or `SHA256`.
#
# When unsure whether a function chooses or uses an algorithm, it's
# pending: wrongly pending costs nothing, wrongly forwarded is a hole.

[[group]]
title = "Asymmetric operations through EVP_PKEY"
class = "pending"
reason = "Starts or performs a public-key operation, or chooses its digest, padding, size or curve."
