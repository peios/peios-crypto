# Ciphers. A cipher context is checked in the direction it's set to, and
# again if it's turned to the other. EVP_AEAD_CTX_init and _new don't say
# which direction a context is for, so are checked for sealing, the
# stricter. The low-level keying functions can't report failure, or have
# callers that never check: a refusal ends the process. A DES key
# schedule may serve single or Triple DES, so is checked as single DES.

[[hook]]
function = "EVP_CipherInit_ex"
signature = "int EVP_CipherInit_ex(EVP_CIPHER_CTX *ctx, const EVP_CIPHER *cipher, ENGINE *engine, const uint8_t *key, const uint8_t *iv, int enc)"
